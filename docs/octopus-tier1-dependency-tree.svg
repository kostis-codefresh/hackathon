<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1950 910" width="1950" height="910" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowHard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888888"/>
    </marker>
  </defs>

  <style>
    .node-rect { fill:#ffffff; stroke:#333333; stroke-width:1.5; }
    .root-rect { fill:#dbeafe; stroke:#2563eb; stroke-width:2; }
    .system-rect { fill:#f1f1f1; stroke:#888888; stroke-width:1.5; stroke-dasharray:6,3; }
    .hard-edge { stroke:#111111; stroke-width:1.8; fill:none; marker-end:url(#arrowHard); }
    .soft-edge { stroke:#888888; stroke-width:1.6; fill:none; stroke-dasharray:5,4; marker-end:url(#arrowSoft); }
    .label { font-size:15px; fill:#111111; text-anchor:middle; dominant-baseline:middle; }
    .label2 { font-size:13.5px; fill:#111111; text-anchor:middle; dominant-baseline:middle; }
    .title { font-size:26px; font-weight:bold; text-anchor:middle; fill:#111111; }
    .legend-text { font-size:14px; fill:#111111; }
  </style>

  <rect x="0" y="0" width="1950" height="910" fill="#ffffff"/>

  <text x="975" y="35" class="title">Octopus Deploy — Tier 1 Resource Dependency Tree</text>

  <!-- ===== EDGES (drawn first, under nodes) ===== -->
  <!-- Hard edges: Space -> row1 -->
  <line x1="975" y1="125" x2="200" y2="195" class="hard-edge"/>
  <line x1="975" y1="125" x2="600" y2="195" class="hard-edge"/>
  <line x1="975" y1="125" x2="1000" y2="195" class="hard-edge"/>
  <line x1="975" y1="125" x2="1400" y2="195" class="hard-edge"/>
  <line x1="975" y1="125" x2="1750" y2="195" class="hard-edge"/>

  <!-- Hard edges: Projects -> row2 -->
  <line x1="1750" y1="245" x2="1270" y2="325" class="hard-edge"/>
  <line x1="1750" y1="245" x2="1505" y2="325" class="hard-edge"/>
  <line x1="1750" y1="245" x2="1740" y2="320" class="hard-edge"/>
  <line x1="1750" y1="245" x2="490" y2="325" class="hard-edge"/>
  <line x1="1750" y1="245" x2="720" y2="325" class="hard-edge"/>
  <line x1="1750" y1="245" x2="995" y2="320" class="hard-edge"/>

  <!-- Hard edges: Environments -> deploymenttargets / tenantlinks -->
  <line x1="200" y1="245" x2="235" y2="320" class="hard-edge"/>
  <line x1="200" y1="245" x2="995" y2="320" class="hard-edge"/>

  <!-- Hard edges: Tenants -> tenantlinks -->
  <line x1="1400" y1="245" x2="995" y2="320" class="hard-edge"/>

  <!-- Hard edges: row2 -> row3 (aligned columns) -->
  <line x1="235" y1="380" x2="235" y2="450" class="hard-edge"/>
  <line x1="490" y1="375" x2="490" y2="455" class="hard-edge"/>
  <line x1="720" y1="375" x2="720" y2="455" class="hard-edge"/>

  <!-- Hard edges: skip-row routing (Environments -> RunbookRuns / Deployments) -->
  <path d="M200,245 L200,300 L405,300 L405,480" class="hard-edge"/>
  <path d="M200,245 L200,310 L635,310 L635,480" class="hard-edge"/>

  <!-- Hard edges: row3 -> Tasks -->
  <line x1="720" y1="505" x2="605" y2="570" class="hard-edge"/>
  <line x1="490" y1="505" x2="605" y2="570" class="hard-edge"/>

  <!-- Hard edges: Tasks -> Interruptions / Events -->
  <line x1="605" y1="630" x2="460" y2="690" class="hard-edge"/>
  <line x1="605" y1="630" x2="750" y2="690" class="hard-edge"/>

  <!-- Soft edges: scoping for Variables / Feature Toggles -->
  <line x1="200" y1="245" x2="1270" y2="325" class="soft-edge"/>
  <line x1="1400" y1="245" x2="1270" y2="325" class="soft-edge"/>
  <line x1="200" y1="245" x2="1505" y2="325" class="soft-edge"/>
  <line x1="1400" y1="245" x2="1505" y2="325" class="soft-edge"/>

  <!-- Soft edges: Accounts/Certificates -> Deployment Targets -->
  <line x1="600" y1="245" x2="235" y2="320" class="soft-edge"/>
  <line x1="1000" y1="245" x2="235" y2="320" class="soft-edge"/>

  <!-- Soft edges: Deployment Targets -> Deployments (role matching) -->
  <line x1="235" y1="380" x2="720" y2="455" class="soft-edge"/>

  <!-- Soft edge: Tenants -> Deployments (tenanted deploys), skip-row routing -->
  <path d="M1400,245 L1400,300 L805,300 L805,480" class="soft-edge"/>

  <!-- ===== NODES ===== -->

  <!-- Space (root) -->
  <rect x="890" y="75" width="170" height="50" rx="8" ry="8" class="root-rect"/>
  <text x="975" y="100" class="label">Space</text>

  <!-- Current User (standalone, not created) -->
  <rect x="1670" y="70" width="260" height="60" rx="8" ry="8" class="system-rect"/>
  <text x="1800" y="91" class="label2">Current User</text>
  <text x="1800" y="109" class="label2">(pre-existing, not created)</text>

  <!-- Row 1 -->
  <rect x="115" y="195" width="170" height="50" rx="8" ry="8" class="node-rect"/>
  <text x="200" y="220" class="label">Environments</text>

  <rect x="515" y="195" width="170" height="50" rx="8" ry="8" class="node-rect"/>
  <text x="600" y="220" class="label">Accounts</text>

  <rect x="915" y="195" width="170" height="50" rx="8" ry="8" class="node-rect"/>
  <text x="1000" y="220" class="label">Certificates</text>

  <rect x="1315" y="195" width="170" height="50" rx="8" ry="8" class="node-rect"/>
  <text x="1400" y="220" class="label">Tenants</text>

  <rect x="1665" y="195" width="170" height="50" rx="8" ry="8" class="node-rect"/>
  <text x="1750" y="220" class="label">Projects</text>

  <!-- Row 2 -->
  <rect x="125" y="320" width="220" height="60" rx="8" ry="8" class="node-rect"/>
  <text x="235" y="341" class="label2">Deployment Targets /</text>
  <text x="235" y="359" class="label2">Machines</text>

  <rect x="405" y="325" width="170" height="50" rx="8" ry="8" class="node-rect"/>
  <text x="490" y="350" class="label">Runbooks</text>

  <rect x="635" y="325" width="170" height="50" rx="8" ry="8" class="node-rect"/>
  <text x="720" y="350" class="label">Releases</text>

  <rect x="865" y="320" width="260" height="60" rx="8" ry="8" class="node-rect"/>
  <text x="995" y="341" class="label2">Tenant ↔ Project ↔</text>
  <text x="995" y="359" class="label2">Environment Links</text>

  <rect x="1185" y="325" width="170" height="50" rx="8" ry="8" class="node-rect"/>
  <text x="1270" y="350" class="label">Variables</text>

  <rect x="1415" y="325" width="180" height="50" rx="8" ry="8" class="node-rect"/>
  <text x="1505" y="350" class="label">Feature Toggles</text>

  <rect x="1655" y="320" width="170" height="60" rx="8" ry="8" class="node-rect"/>
  <text x="1740" y="341" class="label2">Branches</text>
  <text x="1740" y="359" class="label2">(Git-enabled projects)</text>

  <!-- Row 3 -->
  <rect x="140" y="450" width="190" height="60" rx="8" ry="8" class="node-rect"/>
  <text x="235" y="471" class="label2">Kubernetes Targets</text>
  <text x="235" y="489" class="label2">(subtype)</text>

  <rect x="405" y="455" width="170" height="50" rx="8" ry="8" class="node-rect"/>
  <text x="490" y="480" class="label">Runbook Runs</text>

  <rect x="635" y="455" width="170" height="50" rx="8" ry="8" class="node-rect"/>
  <text x="720" y="480" class="label">Deployments</text>

  <!-- Row 4 -->
  <rect x="510" y="570" width="190" height="60" rx="8" ry="8" class="system-rect"/>
  <text x="605" y="591" class="label2">Tasks</text>
  <text x="605" y="609" class="label2">(system-generated)</text>

  <!-- Row 5 -->
  <rect x="360" y="690" width="200" height="60" rx="8" ry="8" class="system-rect"/>
  <text x="460" y="711" class="label2">Interruptions</text>
  <text x="460" y="729" class="label2">(system-generated)</text>

  <rect x="655" y="690" width="190" height="60" rx="8" ry="8" class="system-rect"/>
  <text x="750" y="711" class="label2">Events</text>
  <text x="750" y="729" class="label2">(system-generated)</text>

  <!-- ===== LEGEND ===== -->
  <line x1="150" y1="805" x2="230" y2="805" class="hard-edge"/>
  <text x="245" y="810" class="legend-text">Hard dependency (required to create)</text>

  <line x1="150" y1="838" x2="230" y2="838" class="soft-edge"/>
  <text x="245" y="843" class="legend-text">Soft dependency (optional scoping / linking)</text>

  <rect x="150" y="858" width="60" height="24" rx="5" ry="5" class="system-rect"/>
  <text x="245" y="874" class="legend-text">System-generated / pre-existing (not created directly)</text>
</svg>
