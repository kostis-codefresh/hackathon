name: PR Checks

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: src

      - name: Build
        working-directory: src
        run: go build ./...
